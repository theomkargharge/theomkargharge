<script>
  const T = { dark: ['#0d1117', '#30363d', '#7d8590', 'dark'], dimmed: ['#212830', '#3d444d', '#9198a1', 'dark'],
              light: ['#ffffff', '#d1d9e0', '#59636e', 'light'] };
  function set(t) {
    const [bg, border, muted, variant] = T[t], s = document.documentElement.style;
    s.setProperty('--bg', bg); s.setProperty('--border', border); s.setProperty('--muted', muted);
    document.getElementById('mdcss').href = 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-' + variant + '.min.css';
    document.querySelectorAll('img[data-dark]').forEach(i => { if (i.getAttribute('src') !== i.dataset[variant]) i.setAttribute('src', i.dataset[variant]); });
    document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
    try { localStorage.setItem('readme-preview-theme', t); } catch (e) {}
  }
  document.querySelectorAll('.bar button').forEach(b => b.onclick = () => set(b.dataset.t));
  let saved = 'dimmed'; try { saved = localStorage.getItem('readme-preview-theme') || saved; } catch (e) {}
  set(saved);
</script></body></html>
